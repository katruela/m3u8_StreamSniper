name: Generar Lista IPTV Argentina

on:
  schedule:
    - cron: '0 */6 * * *'  # Se ejecuta automáticamente cada 6 horas
  workflow_dispatch:        # Permite ejecutarlo manualmente con un clic

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # OBLIGATORIO para guardar el archivo .m3u en tu repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install system dependencies (Chromium + chromedriver)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y chromium-browser chromium-chromedriver wget gnupg2 ca-certificates unzip
          echo "CHROMEDRIVER_PATH=$(which chromedriver)" >> $GITHUB_ENV
          echo "BROWSER_PATH=$(which chromium-browser || true)" >> $GITHUB_ENV

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install selenium webdriver-manager
          fi

      - name: Ejecutar Extractor para Canales de Argentina
        env:
          CHROMEDRIVER_PATH: ${{ env.CHROMEDRIVER_PATH }}
        run: |
          python generar_lista.py 2>&1 | tee fetch_stream_output.txt

      - name: Verificar que el archivo exista
        run: |
          test -f argentina.m3u || { echo "No se generó argentina.m3u"; exit 1; }

      - name: Guardar argentina.m3u en GitHub
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add argentina.m3u
          git commit -m "Auto-actualización de canales argentina.m3u" || exit 0
          git push
